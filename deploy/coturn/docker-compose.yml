# Local/CI coturn. The shared secret below is a non-production example only.
services:
  coturn:
    image: coturn/coturn:4.6.3
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:-local-dev-turn-secret}"
      - "--realm=privacy.test"
      - "--external-ip=127.0.0.1"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-cli"
      - "--no-multicast-peers"
