# Local example coturn config. Do not put production secrets here.
# Hosted validation uses deploy/coturn/turnserver.validation.conf and deploy/compose.validation.yml.
# CI and local loopback keep using deploy/coturn/docker-compose.yml.
# Override static-auth-secret via the TURN_SHARED_SECRET environment at deploy time.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
# static-auth-secret is injected at runtime. See docs/TURN_DEPLOYMENT.md.
realm=turn.example.test
server-name=turn.example.test

# Public DNS name clients use. Set external-ip to the server's public address.
# external-ip=203.0.113.10

min-port=49160
max-port=49200
no-multicast-peers
no-cli
no-tcp-relay
# Enable TCP/TLS TURN only after certs are installed:
# cert=/etc/coturn/fullchain.pem
# pkey=/etc/coturn/privkey.pem

log-file=stdout
simple-log
