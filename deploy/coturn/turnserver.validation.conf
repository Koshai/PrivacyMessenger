# Hosted validation coturn template. deploy/coturn/entrypoint.sh substitutes the
# placeholders from the environment. Do not commit a rendered file.
# Local and CI coturn keep using deploy/coturn/docker-compose.yml flags.

listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=__TURN_EXTERNAL_IP__

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=__TURN_SHARED_SECRET__
realm=__TURN_REALM__
server-name=__TURN_REALM__

# Small range for a few concurrent validation calls. Open the same range on the firewall.
min-port=49160
max-port=49260

# UDP relay only. TCP and TLS listeners stay off until a certificate is installed.
no-tcp-relay
no-multicast-peers
no-loopback-peers
no-cli

# Refuse relay targets that are not public unicast destinations.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

log-file=stdout
simple-log
