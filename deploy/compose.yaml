services:
  postgres:
    image: postgres:17
    container_name: private-messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: private_messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U messenger -d private_messenger
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
