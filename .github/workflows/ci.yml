name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: private_messenger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d private_messenger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://messenger:messenger@localhost:5432/private_messenger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Apply migrations
        working-directory: backend
        run: |
          for f in migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Go vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -count=1
      - name: Dependency advisories (govulncheck)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyze and test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: License / dependency audit
        working-directory: mobile
        run: |
          dart pub outdated || true
          flutter pub deps

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: iOS build (no codesign)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - name: Note
        run: echo "iOS simulator runtime tests remain a release gate if not executed in this job."
