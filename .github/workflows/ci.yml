name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: private_messenger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d private_messenger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://messenger:messenger@localhost:5432/private_messenger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Apply migrations
        working-directory: backend
        run: |
          for f in migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Go vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -count=1
      - name: Dependency advisories (govulncheck)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyze and test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Dependency inventory
        working-directory: mobile
        run: flutter pub deps --style=compact

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: iOS build (no codesign)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - name: Native OpenMLS unit tests on macOS
        working-directory: mobile
        run: |
          flutter test test/core/crypto/openmls_poc_test.dart test/core/crypto/device_crypto_lifecycle_test.dart

  live-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
          POSTGRES_DB: private_messenger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d private_messenger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://messenger:messenger@localhost:5432/private_messenger?sslmode=disable
      OTP_HMAC_SECRET: dGVzdC1vdHAtaG1hYy1zZWNyZXQtd2l0aC0zMi1ieXRlcyEh
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci-password-not-used
      SMTP_FROM_EMAIL: noreply@example.test
      SMTP_FROM_NAME: PrivacyMessenger
      APP_HOST: 127.0.0.1
      APP_PORT: "4000"
      LIVE_E2E: "1"
      API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply migrations
        working-directory: backend
        run: |
          for f in migrations/*.up.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Start API
        working-directory: backend
        run: |
          go run ./cmd/api > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Live two-client native OpenMLS E2E
        working-directory: mobile
        run: |
          flutter pub get
          flutter test test/integration/live_two_client_e2e_test.dart
      - name: Stop API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/api.pid" ]; then kill "$(cat "$RUNNER_TEMP/api.pid")" || true; fi

  turn-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Start coturn
        run: |
          docker run -d --name pm-coturn --network host coturn/coturn:4.6.3 \
            -n --log-file=stdout \
            --listening-port=3478 \
            --listening-ip=127.0.0.1 \
            --relay-ip=127.0.0.1 \
            --allow-loopback-peers \
            --fingerprint \
            --lt-cred-mech \
            --use-auth-secret \
            --static-auth-secret=local-dev-turn-secret \
            --realm=privacy.test \
            --external-ip=127.0.0.1 \
            --min-port=49160 --max-port=49200 \
            --no-cli --no-multicast-peers
          sleep 2
          docker logs pm-coturn | tail -n 40
      - name: Relay-only data channel
        working-directory: backend
        env:
          TURN_RELAY_TEST: "1"
          TURN_TEST_SECRET: local-dev-turn-secret
          TURN_TEST_URL: turn:127.0.0.1:3478?transport=udp
        run: go test ./internal/turn/ -count=1 -run TestRelayOnlyDataChannel -v
      - name: Coturn logs
        if: failure()
        run: docker logs pm-coturn | tail -n 80
      - name: Stop coturn
        if: always()
        run: docker rm -f pm-coturn || true
